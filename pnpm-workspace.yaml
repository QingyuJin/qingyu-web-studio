packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  sharp: true
  unrs-resolver: true

catalog:
  "@types/node": ^26.1.1
  eslint: ^10.7.0
  typescript: ^5.9.3
  vitest: ^4.1.10

minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.110.3'
  - '@supabase/functions-js@2.110.3'
  - '@supabase/postgrest-js@2.110.3'
  - '@supabase/realtime-js@2.110.3'
  - '@supabase/ssr@0.12.1'
  - '@supabase/storage-js@2.110.3'
  - '@supabase/supabase-js@2.110.3'
  - postcss@8.5.19
  - tsx@4.23.1

overrides:
  postcss: 8.5.19
