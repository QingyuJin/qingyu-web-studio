function detail(p){app.innerHTML=`<main class="detail ${p.id}"><header class="header wrap"><a class="back" href="#works">← QINGYU STUDIO</a><span class="brandname">${p.name}</span><a class="detail-nav" href="#project/${p.id}/workspace">開始體驗 ↘</a></header><section class="detail-hero wrap"><div class="copy reveal"><div class="studio-kicker"><i></i> ${p.tag}</div><h1>${p.head.map(s=>`<span>${s}</span>`).join('')}</h1><p>${p.intro}</p>${btn(p.cta,'#project/'+p.id+'/workspace','dark')}<div class="detail-kind">${p.kind}</div></div><div class="detail-visual">${cover(p,true)}<div class="detail-visual-caption"><span>${p.name}</span><small>原創視覺示意</small></div></div></section><section class="section chapter wrap"><div class="section-heading"><div><small>THE EXPERIENCE</small><h2>體驗亮點</h2></div></div><div class="chapter-grid">${p.chap.map(([t,d],i)=>`<article><small>0${i+1}</small><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></section><section class="tool-area wrap" id="workspace"></section><section class="end section"><div class="wrap"><small>QINGYU STUDIO</small><h2>探索更多作品</h2><p>獨立設計與開發　概念品牌與本機操作體驗</p><div class="actions">${btn('委託類似網站','https://www.qingyuweb.com/contact?case='+encodeURIComponent(p.name))}${btn('返回全部作品','#works','outline')}</div></div></section>${footer()}</main>`;({ma:ma,aurel:aurel,gloss:gloss,ai:knowledge,flow:()=>operations(false),table:()=>operations(true)}[p.id])()}
function modal(title,content){let d=document.createElement('dialog');d.className='dialog';d.innerHTML=`<button class="close" aria-label="關閉">×</button><h3>${esc(title)}</h3>${content}`;document.body.append(d);d.querySelector('.close').onclick=()=>d.close();d.addEventListener('close',()=>d.remove());d.addEventListener('click',e=>{if(e.target===d)d.close()});d.showModal();return d}
function ma(){let el=$('#workspace'),rooms=['光之居所','木的日常','無聲之間','樹影長廊'],plans=[['局部改造',12000,22000],['新成屋',35000,55000],['老屋翻新',55000,85000]];el.innerHTML=`<small>SELECTED SPACES</small><h2>空間的故事</h2><div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${rooms.map((n,i)=>`<article><div class="item-art">${art('ma',i)}</div><h3>${n}</h3><button class="mini" data-room="${i}">查看空間</button></article>`).join('')}</div><div class="split"><section class="panel"><small>PERSONAL PLAN</small><h3>規劃空間預算</h3><label class="field">工程類型<select id="plan">${plans.map(([n],i)=>`<option value="${i}">${n}</option>`).join('')}</select></label><label class="field">空間坪數 <span id="area-label">25 坪</span><input type="range" id="area" min="5" max="80" value="25"></label><label><input type="checkbox" id="extra"> 包含家具與軟裝</label></section><section class="panel"><small>ESTIMATED BUDGET</small><h3>概念預算區間</h3><div class="total"><strong id="estimate"></strong></div><button class="mini solid" id="download">下載規劃摘要</button><p class="note">概念插畫與試算 非實際設計案例或工程報價</p></section></div>`;function update(){let a=+$('#area').value,p=plans[$('#plan').value],x=$('#extra').checked;$('#area-label').textContent=a+' 坪';$('#estimate').textContent=Math.round((a*p[1]+(x?120000:0))/10000)+' 至 '+Math.round((a*p[2]+(x?240000:0))/10000)+' 萬元'}update();el.addEventListener('input',update);$('#download').onclick=()=>download('MA-space-plan.txt','間序空間規劃\n'+plans[$('#plan').value][0]+'\n'+$('#area-label').textContent+'\n'+$('#estimate').textContent+'\n概念試算');el.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>modal(rooms[b.dataset.room],`<div class="item-art">${art('ma',+b.dataset.room)}</div><p>以自然光 木質與柔和色調建立舒適的生活空間</p><p>原創空間概念插畫 非實際工程案例</p>`))}
const skincare=[['柔霧潔顏霜',1280,'溫和清潔','80 g'],['潤序保濕精華',1680,'日常補水','30 ml'],['柔光舒潤霜',1480,'柔潤保養','50 ml']];function aurel(){let cart=load('cart',{}),el=$('#workspace');el.innerHTML=`<small>THE COLLECTION</small><h2>日常保養系列</h2><div class="grid3">${skincare.map(([n,p,d,s],i)=>`<article><div class="item-art">${art('aurel',i)}</div><small>${s}</small><h3>${n}</h3><p>${d}</p><div class="price">${money(p)}</div><div class="actions"><button class="mini" data-detail="${i}">商品詳情</button><button class="mini solid" data-add="${i}">加入購物袋</button></div></article>`).join('')}</div><div class="split"><section class="panel"><h3>選擇保養偏好</h3><label class="field">偏好<select id="goal"><option value="0">清潔</option><option value="1">補水</option><option value="2">柔潤</option></select></label><p id="recommend"></p><button class="mini" id="recommend-add">加入推薦商品</button><p class="note">依偏好推薦 非醫療診斷</p></section><section class="panel"><h3>購物袋</h3><div id="bag"></div><div class="total"><span>合計</span><strong id="total"></strong></div><button class="mini solid" id="export">下載購物清單</button><p class="note">儲存在此瀏覽器 未串接付款或出貨</p></section></div><section class="panel" style="margin-top:24px"><h3>護膚服務規劃</h3><form id="book"><div class="grid3"><label class="field">服務<select id="service"><option>基礎保養諮詢</option><option>日常補水護理</option><option>個人保養規劃</option></select></label><label class="field">日期<input id="date" type="date" required></label><label class="field">時段<select id="time"><option>10:00</option><option>14:00</option><option>16:00</option></select></label></div><button class="mini solid">儲存個人規劃</button></form><div id="booked"></div><p class="note">本機個人紀錄 不代表真實商家預約</p></section>`;function bag(){store('cart',cart);let keys=Object.keys(cart).filter(k=>cart[k]>0);$('#bag').innerHTML=keys.length?keys.map(k=>`<div class="lineitem"><span>${skincare[k][0]}</span><button class="mini" data-dec="${k}">−</button>${cart[k]}<button class="mini" data-add="${k}">+</button></div>`).join(''):'<p>購物袋目前是空的</p>';$('#total').textContent=money(keys.reduce((s,k)=>s+cart[k]*skincare[k][1],0));$('#export').disabled=!keys.length}function add(k,d){cart[k]=Math.max(0,Math.min(99,(cart[k]||0)+d));bag()}el.onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.add!==undefined)add(b.dataset.add,1);if(b.dataset.dec!==undefined)add(b.dataset.dec,-1);if(b.dataset.detail!==undefined){let i=+b.dataset.detail;let m=modal(skincare[i][0],`<div class="item-art">${art('aurel',i)}</div><p>${skincare[i][2]}　${skincare[i][3]}　${money(skincare[i][1])}</p><button class="mini solid" id="add-modal">加入購物袋</button>`);m.querySelector('#add-modal').onclick=()=>{add(i,1);m.close()}}};$('#goal').onchange=()=>$('#recommend').textContent='推薦 '+skincare[$('#goal').value][0];$('#goal').onchange();$('#recommend-add').onclick=()=>add($('#goal').value,1);$('#export').onclick=()=>download('AUREL-shopping.csv',csv([['商品','數量','單價'],...Object.keys(cart).filter(k=>cart[k]>0).map(k=>[skincare[k][0],cart[k],skincare[k][1]])]),'text/csv');let plans=load('beauty-plans',[]);function bookings(){store('beauty-plans',plans);$('#booked').innerHTML=plans.map((p,i)=>`<div class="lineitem"><span>${esc(p.join('　'))}</span><button class="mini" data-remove="${i}">移除</button></div>`).join('');$('#booked').querySelectorAll('button').forEach(b=>b.onclick=()=>{plans.splice(+b.dataset.remove,1);bookings()})}$('#book').onsubmit=e=>{e.preventDefault();plans.push([$('#service').value,$('#date').value,$('#time').value]);bookings()};bookings();bag()}
function gloss(){let el=$('#workspace'),plans=[['精緻清潔',900],['漆面美容',4500],['鍍膜養護',12000]];el.innerHTML=`<small>THE FINISH</small><h2>細節的差異</h2><div class="compare">${art('gloss',0,false)}<div class="over">${art('gloss',0,true)}</div><div class="rule"></div></div><label class="field">拖曳比較光澤<input type="range" id="compare" class="range" min="0" max="100" value="55"></label><div class="split"><section class="panel"><h3>養護方案</h3><label class="field">方案<select id="plan">${plans.map(([n,p],i)=>`<option value="${i}">${n} ${money(p)}</option>`).join('')}</select></label><label class="field">車型<select id="vehicle"><option value="0">一般轎車</option><option value="500">休旅車</option><option value="1000">大型車</option></select></label><label class="field">希望日期<input type="date" id="date"></label></section><section class="panel"><h3>規劃試算</h3><div class="total"><strong id="estimate"></strong></div><button id="save" class="mini solid">儲存養護規劃</button><button id="export" class="mini">下載規劃</button><p id="status" role="status" class="status"></p><p class="note">原創車體插畫比較 概念費用 非實際報價或預約</p></section></div>`;$('#compare').oninput=e=>{$('.over').style.clipPath='inset(0 '+(100-e.target.value)+'% 0 0)';$('.rule').style.left=e.target.value+'%'};function total(){return plans[+$('#plan').value][1]+ +$('#vehicle').value}function update(){$('#estimate').textContent=money(total())}$('#plan').onchange=update;$('#vehicle').onchange=update;$('#save').onclick=()=>{store('car-plan',[plans[$('#plan').value][0],$('#vehicle').selectedOptions[0].text,$('#date').value,money(total())]);$('#status').textContent='已儲存本機規劃'};$('#export').onclick=()=>download('GLOSS-plan.txt',[plans[$('#plan').value][0],$('#vehicle').selectedOptions[0].text,$('#date').value,money(total()),'概念規劃'].join('\n'));update()}
function knowledge(){let docs=[{name:'服務規範範例.txt',text:'專案交付前需確認功能與手機版測試。\n保固範圍依雙方確認的合約內容為準。\n網站設計需先確認需求與預算。'}],hits=[],el=$('#workspace');el.innerHTML=`<small>KNOWLEDGE WORKSPACE</small><h2>從你的文件找到答案</h2><p>真實本機文字搜尋 不將文件送往外部服務</p><div class="split"><section class="panel"><h3>文件庫</h3><label class="field">匯入 TXT MD CSV<input id="files" type="file" multiple accept=".txt,.md,.csv"></label><div id="docs"></div><p class="note">文件僅在本次工作階段保留</p><div id="notice" role="status" class="status"></div></section><section class="panel"><h3>搜尋文件</h3><form id="search" class="search"><input id="query" placeholder="例如 保固" aria-label="搜尋關鍵字" required><button class="mini solid">搜尋</button></form><div class="results" id="results"><p>輸入關鍵字查看原文段落</p></div><button class="mini" id="export" disabled>匯出搜尋結果</button></section></div><p class="note">目前為本機文字檢索工具 未串接生成式 AI 模型或企業資料庫</p>`;function list(){$('#docs').innerHTML=docs.map((d,i)=>`<div class="lineitem"><span>${esc(d.name)}</span><button class="mini" data-remove="${i}">移除</button></div>`).join('');$('#docs').querySelectorAll('button').forEach(b=>b.onclick=()=>{docs.splice(+b.dataset.remove,1);list();$('#results').innerHTML='<p>文件已更新 請重新搜尋</p>';$('#export').disabled=true})}$('#files').onchange=async e=>{for(let f of e.target.files){if(!/\.(txt|md|csv)$/i.test(f.name)||f.size>1e6){$('#notice').textContent='僅接受 1 MB 以內文字文件';continue}try{docs.push({name:f.name,text:await f.text()})}catch{$('#notice').textContent='有文件無法讀取'}}list();e.target.value=''};$('#search').onsubmit=e=>{e.preventDefault();let q=$('#query').value.trim().toLowerCase();if(!q)return;hits=docs.flatMap(d=>d.text.split(/\n+/).map((t,i)=>({name:d.name,t,i}))).filter(x=>x.t.toLowerCase().includes(q)).slice(0,30);$('#results').innerHTML=hits.length?hits.map(x=>`<article><small>${esc(x.name)}　段落 ${x.i+1}</small>${esc(x.t)}</article>`).join(''):'<p>找不到符合的段落</p>';$('#export').disabled=!hits.length};$('#export').onclick=()=>download('knowledge-results.txt',hits.map(x=>x.name+' 段落 '+(x.i+1)+'\n'+x.t).join('\n\n'));list()}
function operations(table){let key=table?'table':'flow',items=table?[['炭烤牛小排飯',280,999],['蕈菇燉飯',240,999],['梅子氣泡飲',95,999]]:[['原葉紅茶',360,40],['台灣米',420,30],['精選咖啡豆',680,25],['冷壓橄欖油',520,18]],stages=table?['新單','備餐中','已送達']:['待確認','備貨中','已出貨'],d=load(key,{orders:[],stock:items.map(x=>x[2])}),cart={},mode='client',el=$('#workspace');el.innerHTML=`<small>OPERATIONS WORKSPACE</small><h2>${table?'餐桌與廚房':'訂貨與出貨'}</h2><p>建立本機訂單後切換管理端查看狀態</p><div class="tabs" style="margin-top:24px"><button class="tab" data-mode="client" aria-pressed="true">${table?'餐桌點餐':'客戶訂貨'}</button><button class="tab" data-mode="admin" aria-pressed="false">${table?'廚房管理':'營運後台'}</button></div><div class="workspace" id="ops"></div><p class="note">資料儲存在此瀏覽器 未串接跨裝置同步或正式商業金流</p>`;function render(){let total=items.reduce((s,x,i)=>s+(cart[i]||0)*x[1],0);if(mode==='client'){$('#ops').innerHTML=`<div class="split"><div class="grid3">${items.map(([n,p],i)=>`<article class="panel"><div class="item-art">${table?art('table',i):`<span class="glyph">${n[0]}</span>`}</div><h3>${n}</h3><p>${money(p)} ${table?'':'　庫存 '+d.stock[i]}</p><div class="lineitem"><button class="mini" data-delta="${i},-1">−</button><span>${cart[i]||0}</span><button class="mini" data-delta="${i},1">+</button></div></article>`).join('')}</div><section class="panel"><h3>本次訂單</h3>${table?'<label class="field">桌號<select id="table-no">'+Array.from({length:12},(_,i)=>`<option>${i+1}</option>`).join('')+'</select></label>':''}${items.map(([n,p],i)=>cart[i]>0?`<div class="lineitem"><span>${n} × ${cart[i]}</span><b>${money(cart[i]*p)}</b></div>`:'').join('')}<div class="total"><span>合計</span><strong>${money(total)}</strong></div><button class="mini solid" id="submit" ${!total?'disabled':''}>建立本機訂單</button><p role="status" id="msg" class="status"></p></section></div>`;$('#submit').onclick=()=>{let lines=items.flatMap(([n,p],i)=>cart[i]>0?[[i,n,cart[i],p]]:[]);if(!lines.length)return;d.orders.unshift({id:Date.now(),table:$('#table-no')?.value||'',lines,total,status:0});if(!table)lines.forEach(([i,n,q])=>d.stock[i]-=q);store(key,d);cart={};render();$('#msg').textContent='已儲存本機訂單 請切換管理端'};$('#ops').querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>{let [i,v]=b.dataset.delta.split(',').map(Number),tableNo=$('#table-no')?.value;cart[i]=Math.max(0,Math.min(table?30:d.stock[i],(cart[i]||0)+v));render();if(tableNo)$('#table-no').value=tableNo})}else{$('#ops').innerHTML=`<section class="panel"><div class="metrics">${stages.map((s,i)=>`<div><small>${s}</small><strong>${d.orders.filter(o=>o.status===i).length}</strong></div>`).join('')}</div>${d.orders.length?d.orders.map(o=>`<div class="lineitem"><span><small>${o.table?'桌號 '+o.table:'訂貨單'}　${String(o.id).slice(-6)}</small><br>${o.lines.map(l=>esc(l[1])+' × '+l[2]).join('　')}<br>${stages[o.status]}</span><b>${money(o.total)}</b><button class="mini" data-next="${o.id}" ${o.status===2?'disabled':''}>${o.status===2?'已完成':'下一階段'}</button></div>`).join(''):'<p style="margin:20px 0">目前沒有訂單</p>'}<div class="actions" style="margin-top:20px"><button class="mini solid" id="export">匯出訂單 CSV</button><button class="mini" id="reset">重設本機資料</button></div></section>`;$('#ops').querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{let o=d.orders.find(o=>o.id===+b.dataset.next);o.status=Math.min(2,o.status+1);store(key,d);render()});$('#export').onclick=()=>download(key+'-orders.csv',csv([['訂單','商品','數量','單價','狀態'],...d.orders.flatMap(o=>o.lines.map(l=>[o.id,l[1],l[2],l[3],stages[o.status]]))]),'text/csv');$('#reset').onclick=()=>{if(confirm('清除本機訂單與庫存紀錄？')){d={orders:[],stock:items.map(x=>x[2])};cart={};store(key,d);render()}}}el.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode))}el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});render()}
let current='';function route(){let hash=location.hash.slice(1)||'home',parts=hash.split('/'),id=parts[0]==='project'?parts[1]:null,p=data.find(x=>x.id===id),key=p?p.id:'home';if(key!==current){cleanup();cleanup=()=>{};current=key;if(p){document.title=p.name+' '+p.zh+' Qingyu Studio';detail(p)}else{document.title='Qingyu Studio 數位設計與技術工作室';home()}window.scrollTo(0,0)}let target=p?(parts[2]==='workspace'?'workspace':null):['works','services','contact'].includes(hash)?hash:null;if(target)requestAnimationFrame(()=>document.getElementById(target)?.scrollIntoView({behavior:'instant'}))}window.addEventListener('hashchange',route);route();
</script></body></html>
